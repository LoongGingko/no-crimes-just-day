###############################################################################
logging:
   level:
     # 根日志级别 (默认INFO)
     root: INFO
     # 打印 SQL 语句
     com.loogingko.ncjd.mapper: DEBUG
     # 或者打印所有 MyBatis 日志
#     org.apache.ibatis: DEBUG
  
#  级别越高，输出的日志越少。
#  ERROR (最高) - 错误事件，程序无法继续运行
#  ↑
#  WARN        - 警告事件，可能存在问题但不影响运行
#  ↑
#  INFO        - 重要业务流程的普通信息 (根日志器默认级别 INFO)
#  ↑
#  DEBUG       - 调试信息，用于开发调试
#  ↑
#  TRACE (最低) - 最详细的追踪信息，比 DEBUG 更细